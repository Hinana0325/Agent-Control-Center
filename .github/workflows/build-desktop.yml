name: Build Desktop

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/build-desktop.yml' ]
    tags: [ 'v*' ]
  pull_request:
    paths: [ 'desktop/**' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} — test & package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
          - os: macos-latest
            format: dmg
          - os: ubuntu-latest
            format: deb

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Unit tests
        run: ./gradlew test --console=plain
        working-directory: desktop

      - name: Package (${{ matrix.format }})
        run: ./gradlew packageDistributionForCurrentOS --console=plain
        working-directory: desktop

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports-${{ matrix.os }}
          path: desktop/build/test-results/test/
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          # 命名需区别于 test-reports 产物，避免 Release 任务误收（扫描修复项 C3）
          name: desktop-installer-${{ matrix.format }}
          path: |
            desktop/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}
          if-no-files-found: error

  release:
    name: Upload installers to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-installer-*
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
